<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="mark">S.</div>
    <h1>Portfolio Admin</h1>
    <p class="sub">Sign in to edit your live portfolio.</p>
    <div class="field"><label for="lu">Username</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
    <label class="toggle" style="margin-bottom:1rem"><input type="checkbox" id="lkeep" checked><span>Keep me signed in on this device</span></label>
    <div class="err" id="lerr"></div>
    <button class="btn primary" style="width:100%" type="submit" id="lbtn">Sign in</button>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <h1><div class="mark">S.</div><span class="txt">Portfolio Admin</span></h1>
    <span class="pill" id="status">Loading…</span>
    <button class="btn only-small" id="btnPreview">👁 Preview</button>
    <a class="btn" id="btnView" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn primary" id="btnPublish">🚀 Publish</button>
  </header>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
  <aside class="preview" id="preview">
    <div class="pv-bar">
      <b>Live preview</b>
      <button class="btn sm" id="pvDesk">🖥 Desktop</button>
      <button class="btn sm" id="pvMob">📱 Mobile</button>
      <button class="btn sm only-small" id="pvClose">✕ Close</button>
    </div>
    <div class="pv-stage" id="pvStage"><iframe id="pvFrame" title="Preview"></iframe></div>
  </aside>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="../assets/site.js"></script>
<script src="admin.js"></script>
</body>
</html>
